<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Application Autofill</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --accent: #0a66c2; --warn: #b3261e; --ok: #1b7f3b; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --muted: #a1a1a6; --bg: #1c1c1e; --accent: #5aa9ff; --warn: #ff6b60; --ok: #5fd27f; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 12px 14px 14px; font: 13px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  #status { font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; overflow-wrap: anywhere; }
  ul.warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
  <div id="status" role="status">Filling from your dictionary…</div>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
